name: Build Unsigned iOS App
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Generate Native iOS Folder
        run: npx expo prebuild -p ios --clean

      - name: Force Node Path for Xcode
        run: |
          cd ios
          echo "export NODE_BINARY=$(which node)" > .xcode.env.local
          sudo ln -sf $(which node) /usr/local/bin/node

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS App (Bypass Certificates)
        run: |
          cd ios
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          
          set -o pipefail
          # تم استبدال أمر التوجيه الإجباري بمسار DerivedData المنظم
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath "$PWD/DerivedData" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO ENABLE_USER_SCRIPT_SANDBOXING=NO build | xcpretty

      - name: Convert to IPA
        run: |
          cd ios
          mkdir -p Payload
          # سحب التطبيق من المسار الافتراضي المنظم
          mv DerivedData/Build/Products/Release-iphoneos/*.app Payload/
          zip -r ../myApp.ipa Payload

      - name: Upload IPA File
        uses: actions/upload-artifact@v4
        with:
          name: myApp-iOS-Build
          path: myApp.ipa
