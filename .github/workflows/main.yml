name: Build Unsigned iOS App
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Force Node Path Globally
        run: sudo ln -sf $(which node) /usr/local/bin/node

      - name: Install Dependencies
        run: npm install

      - name: Generate Native iOS Folder
        run: npx expo prebuild -p ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS App (Global Override)
        run: |
          cd ios
          
          # إنشاء ملف إعدادات جبار لتعطيل الحماية تماماً
          cat << 'EOF' > disable_signing.xcconfig
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGN_IDENTITY = 
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = 
          PROVISIONING_PROFILE_SPECIFIER = 
          ENABLE_USER_SCRIPT_SANDBOXING = NO
          EOF
          
          # إجبار خادم Mac على توريث هذا الملف لأي عملية بناء (رئيسية أو فرعية)
          export XCODE_XCCONFIG_FILE="$PWD/disable_signing.xcconfig"
          
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphoneos -destination "generic/platform=iOS" build

      - name: Extract & Convert to IPA
        run: |
          cd ios
          mkdir -p Payload
          
          # البحث الديناميكي عن التطبيق الجاهز في مسارات Mac العميقة
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | grep "Release-iphoneos" | head -1)
          cp -R "$APP_PATH" Payload/
          zip -r ../myApp.ipa Payload

      - name: Upload IPA File
        uses: actions/upload-artifact@v4
        with:
          name: myApp-iOS-Build
          path: myApp.ipa
