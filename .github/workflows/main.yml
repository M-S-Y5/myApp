name: Build Unsigned iOS App
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14 # الرجوع لإصدار مستقر لتجنب تعقيدات Xcode 16 الأمنية
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Generate Native iOS Folder
        run: npx expo prebuild -p ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Disable Code Signing for Main App
        # تعطيل الشهادات برمجياً داخل ملف التطبيق دون المساس بالمكتبات الفرعية
        run: |
          cd ios
          cat << 'EOF' > nuke_signing.rb
          require 'xcodeproj'
          project_path = Dir.glob("*.xcodeproj").first
          project = Xcodeproj::Project.open(project_path)
          project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
              config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
              config.build_settings['CODE_SIGN_IDENTITY'] = ''
              config.build_settings['DEVELOPMENT_TEAM'] = ''
            end
          end
          project.save
          EOF
          ruby nuke_signing.rb

      - name: Build iOS App
        run: |
          cd ios
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          
          # سطر بناء نظيف يترك للمكتبات حريتها الكاملة في التجميع
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath "$PWD/DerivedData" build

      - name: Extract & Convert to IPA
        run: |
          cd ios
          mkdir -p Payload
          
          # استخراج التطبيق من مسار DerivedData المحلي الذي حددناه
          APP_PATH=$(find "$PWD/DerivedData" -name "*.app" -type d | grep "Release-iphoneos" | head -1)
          echo "App found at: $APP_PATH"
          
          cp -R "$APP_PATH" Payload/
          zip -r ../myApp.ipa Payload

      - name: Upload IPA File
        uses: actions/upload-artifact@v4
        with:
          name: myApp-iOS-Build
          path: myApp.ipa
