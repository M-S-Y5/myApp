name: Build iOS Simulator App
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Generate Native iOS Folder
        run: npx expo prebuild -p ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build for iOS Simulator
        run: |
          cd ios
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          
          # التوجيه حصراً لبيئة المحاكي (iphonesimulator) يلغي طلبات الشهادات جذرياً
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator -destination "generic/platform=iOS Simulator" -derivedDataPath "$PWD/DerivedData" build

      - name: Compress Simulator App
        run: |
          cd ios
          # البحث عن ملف التطبيق داخل مجلد المحاكي وضغطه
          APP_PATH=$(find "$PWD/DerivedData" -name "*.app" -type d | grep "Release-iphonesimulator" | head -1)
          cd "$APP_PATH/.."
          APP_NAME=$(basename "$APP_PATH")
          zip -r "../../../../../myApp-Simulator.zip" "$APP_NAME"

      - name: Upload Simulator Build
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Simulator-Build
          path: myApp-Simulator.zip
