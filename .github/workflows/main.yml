name: Build Unsigned iOS App
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    # فرض إيقاف الشهادات الأمنية على كافة العمليات الرئيسية والفرعية
    env:
      CODE_SIGNING_ALLOWED: 'NO'
      CODE_SIGNING_REQUIRED: 'NO'
      CODE_SIGN_IDENTITY: '-'
      ENABLE_USER_SCRIPT_SANDBOXING: 'NO'
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Global Node Path for Xcode
        run: sudo ln -sf $(which node) /usr/local/bin/node

      - name: Install Dependencies
        run: npm install

      - name: Generate Native iOS Folder
        run: npx expo prebuild -p ios --clean

      - name: Disable Xcode Sandboxing Globally
        # إيقاف الحماية من جذور النظام لمنع حظر السكربتات الداخلية
        run: defaults write com.apple.dt.Xcode IDEEnableUserScriptSandboxing -bool NO

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS App
        run: |
          cd ios
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          # بناء التطبيق في المسار الافتراضي لتجنب تصادم المكتبات
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphoneos -destination "generic/platform=iOS" build

      - name: Convert to IPA
        run: |
          cd ios
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          mkdir -p Payload
          
          # البحث التلقائي عن التطبيق في مسار النظام الافتراضي
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -type d -path "*/Build/Products/Release-iphoneos/${SCHEME}.app" | head -1)
          
          cp -R "$APP_PATH" Payload/
          zip -r ../myApp.ipa Payload

      - name: Upload IPA File
        uses: actions/upload-artifact@v4
        with:
          name: myApp-iOS-Build
          path: myApp.ipa
