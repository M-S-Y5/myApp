name: Build Unsigned iOS App
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Generate Native iOS Folder
        run: npx expo prebuild -p ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Disable Code Signing & Sandboxing Globally
        run: |
          cd ios
          cat << 'EOF' > nuke_signing.rb
          require 'xcodeproj'
          # البحث الشامل لتدمير الحماية في التطبيق والمكتبات الفرعية معاً
          Dir.glob("**/*.xcodeproj").each do |path|
            begin
              project = Xcodeproj::Project.open(path)
              project.targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                  config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                  config.build_settings['CODE_SIGN_IDENTITY'] = ''
                  config.build_settings['DEVELOPMENT_TEAM'] = ''
                  config.build_settings['ENABLE_USER_SCRIPT_SANDBOXING'] = 'NO'
                end
              end
              project.save
            rescue
            end
          end
          EOF
          ruby nuke_signing.rb

      - name: Build iOS App
        run: |
          cd ios
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          
          # فرض متغيرات بيئية قاطعة في سطر الأوامر لتخطي أي سكربت متمرد
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath "$PWD/DerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" ENABLE_USER_SCRIPT_SANDBOXING=NO build

      - name: Extract & Convert to IPA
        run: |
          cd ios
          mkdir -p Payload
          APP_PATH=$(find "$PWD/DerivedData" -name "*.app" -type d | grep "Release-iphoneos" | head -1)
          cp -R "$APP_PATH" Payload/
          zip -r ../myApp.ipa Payload

      - name: Upload IPA File
        uses: actions/upload-artifact@v4
        with:
          name: myApp-iOS-Build
          path: myApp.ipa
